<div class="page-container">
  <div class="page-card">
    <div class="header">
      <div>
        <a routerLink="/dashboard" class="back-link">← Volver al panel</a>
        <h1>Clientes</h1>
        <p>Administra el registro de clientes del sistema.</p>
      </div>
    </div>

    <div class="form-card">
      <h2>Agregar cliente</h2>

      <div class="form-grid">
        <input [(ngModel)]="nuevo.id" type="number" placeholder="ID" />
        <input [(ngModel)]="nuevo.nombre" type="text" placeholder="Nombre completo" />
        <input [(ngModel)]="nuevo.correo" type="email" placeholder="Correo electrónico" />
        <input [(ngModel)]="nuevo.telefono" type="text" placeholder="Teléfono" />
        <input [(ngModel)]="nuevo.direccion" type="text" placeholder="Dirección" class="full-width" />
      </div>

      <button class="primary-btn" (click)="agregar()">Agregar cliente</button>
    </div>

    <div class="list-section">
      <h2>Lista de clientes</h2>

      <div class="empty" *ngIf="clientes.length === 0">
        No hay clientes registrados.
      </div>

      <div class="client-grid">
        <div class="client-card" *ngFor="let cliente of clientes; let i = index">
          <div class="client-info">
            <div class="avatar">
              {{ cliente.nombre.charAt(0) }}
            </div>

            <div class="details">
              <h3>{{ cliente.nombre }}</h3>
              <p><strong>Correo:</strong> {{ cliente.correo }}</p>
              <p><strong>Teléfono:</strong> {{ cliente.telefono }}</p>
              <p><strong>Dirección:</strong> {{ cliente.direccion }}</p>
            </div>
          </div>
        <button class="delete-btn" (click)="eliminar(cliente.id)">Eliminar</button>        </div>
      </div>
    </div>
  </div>
</div>
