<div class="login-page">

  <div class="login-card">

    <h1>TechStore Login</h1>

    <p>Ingrese sus credenciales</p>

    <input
      type="text"
      placeholder="Usuario"
      [(ngModel)]="username"
      (keyup.enter)="ingresar()"
    />

    <input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
      (keyup.enter)="ingresar()"
    />

    <button
      (click)="ingresar()"
      [disabled]="cargando"
    >

      {{ cargando ? 'Ingresando...' : 'Ingresar' }}

    </button>

    <p class="error" *ngIf="mensaje">
      {{ mensaje }}
    </p>

  </div>

</div>
