<div class="login-container">
  <div class="card">
    <h2>Login Comercio</h2>
    <p>Ingresa tus credenciales</p>

    <input
      type="text"
      [(ngModel)]="username"
      placeholder="Usuario"
    />

    <input
      type="password"
      [(ngModel)]="password"
      placeholder="Contraseña"
    />

    <button (click)="ingresar()">Ingresar</button>

    <p class="error" *ngIf="mensaje">{{ mensaje }}</p>
  </div>
</div>
