<div class="login-page">
  <div class="login-card">

    <h1>TechStore Login</h1>
    <p>Ingresa tus credenciales para continuar</p>

    <input
      type="text"
      placeholder="Usuario"
      [(ngModel)]="username"
    >

    <input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
    >

    <button type="button" (click)="iniciarSesion()">
      Ingresar
    </button>

    <span class="error" *ngIf="error">
      {{ error }}
    </span>

  </div>
</div>
